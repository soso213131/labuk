{% extends 'web_app/base.html' %}
{% block title %}Відновлення пароля{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">Відновлення пароля 🔑</h2>
    <p style="text-align: center; color: #7f8c8d; font-size: 14px;">Введіть ваш email, і ми надішлемо інструкції для скидання пароля.</p>
    <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #e67e22; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Відправити лист</button>
    </form>
</div>
{% endblock %}
