{% extends 'web_app/base.html' %}
{% block title %}Новий пароль{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">Новий пароль 🔒</h2>
    <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Зберегти пароль</button>
    </form>
</div>
{% endblock %}
