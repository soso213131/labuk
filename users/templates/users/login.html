{% extends 'web_app/base.html' %}
{% block title %}Вхід{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">Вхід у систему 🔐</h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #3498db; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">Увійти</button>
    </form>

    <!-- КНОПКА ЗАБУЛИ ПАРОЛЬ -->
    <div style="text-align: center; margin-top: 15px;">
        <a href="{% url 'users:password_reset' %}" style="color: #7f8c8d; font-size: 14px; text-decoration: none; border-bottom: 1px dashed #7f8c8d; padding-bottom: 2px;">Забули пароль?</a>
    </div>

    <hr style="border: 0; height: 1px; background: #ddd; margin: 25px 0;">

    <p style="text-align: center; margin-top: 10px; font-size: 14px;">
        Немає акаунту? <a href="{% url 'users:register' %}" style="color: #e67e22; font-weight: bold; text-decoration: none;">Зареєструватися</a>
    </p>
</div>
{% endblock %}
