<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин Рибалка{% endblock %}</title>
    <style>
        /* Мінімальні стилі для зручності */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header, footer { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        header h1 { margin: 0; }

        nav { background: #34495e; padding: 10px; }
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 25px; }
        nav ul li a { color: white; text-decoration: none; font-weight: bold; transition: 0.3s; }
        nav ul li a:hover { color: #3498db; }

        main { min-height: 80vh; padding: 20px; max-width: 1200px; margin: 0 auto; }

        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 250px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; }

        footer { font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <h1>🎣 Магазин «Рибалка»</h1>
</header>

<nav>
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
        <ul>
            <li><a href="{% url 'home_page' %}">Головна</a></li>
            {% for cat in categories %}
                <li><a href="{{ cat.get_absolute_url }}">{{ cat.name }}</a></li>
            {% endfor %}
        </ul>

        <!-- НОВА ФОРМА ПОШУКУ -->
        <form action="{% url 'home_page' %}" method="get" style="display: flex; gap: 5px;">
            <input type="text" name="search" placeholder="Шукати снасті..." value="{{ request.GET.search }}" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc;">
            <button type="submit" style="padding: 5px 15px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">🔍</button>
        </form>
    </div>
</nav>

<main>
    {% block content %}
    <!-- Тут відображається основний контент сторінок -->
    {% endblock %}
</main>

<footer>
    <p>&copy; 2026 Магазин «Рибалка». Найкраще спорядження для вашого улову!</p>
</footer>

</body>
</html>
