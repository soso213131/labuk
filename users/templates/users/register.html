{% extends 'web_app/base.html' %}
{% block title %}Реєстрація{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">Реєстрація 📝</h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">Створити акаунт</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        Вже маєте акаунт? <a href="{% url 'users:login' %}" style="color: #3498db; font-weight: bold;">Увійти</a>
    </p>
</div>
{% endblock %}
